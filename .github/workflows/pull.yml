name: Pull Data and Publish
permissions:
    id-token: write
    contents: write
    pages: write
on:
    workflow_dispatch:
    schedule:
        - cron: '0 0 2 * *'
jobs:
    pull:
        runs-on: ubuntu-latest
        outputs:
            data_changed: ${{ steps.check_diff.outputs.changed }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Pull Update Data
              env:
                  CDN_AUTH_KEY: ${{ secrets.CDN_AUTH_KEY }}
              run: npm run pull
            - name: Check Changed
              id: check_diff
              run: |
                  if git diff --quiet HEAD src/data.ts; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi
            - name: Commit and Push
              if: steps.check_diff.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/data.ts
                  git commit -m ":bento: 自动更新数据"
                  git push origin HEAD:refs/heads/${{ github.ref_name }}
    publish:
        needs: pull
        if: needs.pull.outputs.data_changed == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref_name }}
                  fetch-depth: 2
            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 'latest'
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm install
            - name: Build
              run: npm run build
            - name: Commit and Push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git reset HEAD~1
                  git add .
                  git commit -m ":bento: 自动更新数据"
                  git push --force origin HEAD:refs/heads/${{ github.ref_name }}
                  npm version patch -m ":bookmark: v%s" -s
                  git push --follow-tags origin HEAD:refs/heads/${{ github.ref_name }}
            - name: Publish GitHub
              run: npm publ --registry=https://npm.pkg.github.com
              env:
                  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
            - name: Publish NPM
              run: |
                  sed -i 's/"name": "@pomerun\/china-railway-station"/"name": "china-railway-station"/' package.json
                  npm pack
                  TARBALL=$(ls *.tgz)
                  npm publ $TARBALL --registry=https://registry.npmjs.org
                  git checkout package.json
                  rm $TARBALL
    deploy:
        needs: publish
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref_name }}
            - name: Build Site
              run: |
                  mkdir -p _site/build
                  cp build/index.iife.js _site/build/index.iife.js
                  sed 's#\.\./build/index\.iife\.js#build/index.iife.js#' docs/index.html > _site/index.html
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: _site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
